name: Test Streamlit application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile streamlit_app.py section_retries.py test_section_retries.py character_images.py test_character_images.py voice_alignment.py test_voice_alignment.py video_forms_ui.py video_scene_planner.py test_video_scene_planner.py test_voice_alignment.py test_character_images.py test_optimized_workflow.py background_registry.py test_background_registry.py browser_session_store.py copy_buttons.py session_name_controls.py api_clients.py background_jobs.py groq_pacing.py transcript_sources.py persistent_store.py test_persistent_store.py test_browser_session_store.py test_copy_buttons.py test_session_name_controls.py test_api_clients.py test_background_jobs.py test_video_scene_planner.py test_transcript_sources.py test_streamlit_smoke.py
      - name: Run API provider unit tests
        run: python -m unittest -v test_section_retries.py test_video_scene_planner.py test_voice_alignment.py test_character_images.py test_optimized_workflow.py test_api_clients.py test_background_jobs.py test_background_registry.py test_groq_pacing.py test_transcript_sources.py test_persistent_store.py test_browser_session_store.py test_copy_buttons.py test_session_name_controls.py
      - name: Run Streamlit UI smoke tests
        run: python -m unittest -v test_streamlit_smoke.py
