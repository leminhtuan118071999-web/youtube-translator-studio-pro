name: V3 Windows Installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['v3/**', '.github/workflows/v3-windows.yml']
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Build installer with isolated runtime
        run: python v3/windows/build.py
      - name: Verify packaged runtime and real Windows rendering
        shell: pwsh
        run: |
          python -c "from v3.windows.launcher import ffmpeg_setup; print(ffmpeg_setup(print))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:LOCALAPPDATA\LMTStudioPro\V3\tools;$env:PATH"
          $env:PYTHONPATH = ''
          $installer = (Get-Item dist/windows/*.exe).FullName
          $installed = Join-Path $env:RUNNER_TEMP 'LMT Installed Test'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$installed+'"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $smokeFile = Join-Path $env:RUNNER_TEMP 'v3-smoke.json'
          $smoke = Start-Process -FilePath "$installed\LMTStudioV3.exe" -ArgumentList @('--smoke-test',('"'+$smokeFile+'"')) -PassThru
          if (!$smoke.WaitForExit(120000)) { throw 'Launcher smoke timed out' }
          if ($smoke.ExitCode -ne 0) { Get-Content $smokeFile; throw 'Frozen launcher smoke failed' }
          $smokeResult = Get-Content $smokeFile | ConvertFrom-Json
          if (!$smokeResult.ok -or !$smokeResult.server -or !$smokeResult.runtime) { throw 'Installed app not ready' }
          Set-Location $installed
          & .\runtime\python.exe -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')" 
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime\python.exe -c "import streamlit, faster_whisper, onnxruntime, av, scipy; from v3 import projects, render_worker, speech; print('Runtime imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime\python.exe -m unittest v3.tests.test_windows_portability v3.tests.test_recovery v3.tests.test_cutout v3.tests.test_story_defaults v3.tests.test_output_defaults v3.tests.test_thumbnail_theme -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LMT-Studio-V3-Windows-x64-3.3.0
          path: |
            dist/windows/*.exe
            dist/windows/*.sha256
            dist/windows/build-info.json
            v3/windows/README.md
          if-no-files-found: error
          retention-days: 30
