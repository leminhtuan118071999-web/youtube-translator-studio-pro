<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 56px; padding: 0; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: flex-end; gap: 8px;
           color: var(--text-color, #e6e8ec); font: 500 13px system-ui, sans-serif; }
    /* One design for every "Copy toàn bộ" action, in light and dark themes. */
    button {
      cursor: pointer;
      min-height: 40px;
      max-width: 100%;
      padding: 8px 16px;
      border-radius: 9px;
      border: 1px solid #1352bd;
      background: linear-gradient(180deg, #3186ff 0%, #1461dc 100%);
      color: #fff;
      font: 800 13px/1.3 system-ui, sans-serif;
      letter-spacing: .1px;
      text-shadow: 0 1px 1px rgba(8, 33, 95, .65);
      box-shadow: 0 3px 0 #0b398a, 0 5px 10px rgba(15, 65, 145, .24),
                  inset 0 1px 0 rgba(255, 255, 255, .35);
      transition: transform .13s ease, filter .13s ease, box-shadow .13s ease;
    }
    button:hover:enabled {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #0b398a, 0 7px 14px rgba(15, 65, 145, .32),
                  inset 0 1px 0 rgba(255, 255, 255, .35);
    }
    button:active:enabled {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0b398a, inset 0 1px 3px rgba(0, 0, 0, .15);
    }
    button:focus-visible { outline: 3px solid #84c8ff; outline-offset: 3px; }
    /* No content: retain a readable blue label while preventing copying. */
    button:disabled {
      cursor: not-allowed;
      background: linear-gradient(180deg, #5c9ded 0%, #3674cc 100%);
      border-color: #3974ba;
      color: #fff;
      text-shadow: 0 1px 1px rgba(8, 33, 95, .5);
      box-shadow: 0 2px 0 #285899, inset 0 1px 0 rgba(255,255,255,.3);
    }
    #status { font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
    .ok { color: #20a568; }
    .bad { color: #df5e60; }
  </style>
</head>
<body>
  <span id="status" role="status" aria-live="polite"></span>
  <button id="copy" type="button" disabled>📋 Copy toàn bộ</button>
  <script>
  "use strict";
  (function () {
    let source = "";
    let currentLabel = "📋 Copy toàn bộ";
    const button = document.getElementById("copy");
    const status = document.getElementById("status");
    const send = (type, extras) => {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extras }, "*");
    };
    function fallbackCopy(text) {
      const area = document.createElement("textarea");
      area.value = text;
      area.readOnly = true;
      area.style.position = "fixed";
      area.style.top = "-10000px";
      area.style.left = "0";
      document.body.appendChild(area);
      area.focus();
      area.select();
      let copied = false;
      try { copied = document.execCommand("copy"); }
      catch (_error) { copied = false; }
      area.remove();
      return copied;
    }
    button.addEventListener("click", async function () {
      if (!source) return;
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(source);
          copied = true;
        }
      } catch (_error) {
        // Some browsers restrict clipboard-write in iframe components.
      }
      if (!copied) copied = fallbackCopy(source);
      if (copied) {
        status.textContent = "✅ Đã sao chép";
        status.className = "ok";
        button.textContent = "✅ Đã copy";
      } else {
        status.textContent = "Không thể sao chép; hãy mở mục để dùng biểu tượng Copy.";
        status.className = "bad";
        button.textContent = currentLabel;
      }
    });
    window.addEventListener("message", function (event) {
      const message = event.data;
      if (!message || message.type !== "streamlit:render" || !message.args) return;
      const args = message.args;
      source = typeof args.text === "string" ? args.text : "";
      currentLabel = typeof args.label === "string" ? args.label : "📋 Copy toàn bộ";
      button.textContent = currentLabel;
      button.disabled = !source;
      button.setAttribute("aria-label", currentLabel);
      status.textContent = "";
      status.className = "";
      const theme = args.theme || {};
      for (const [key, property] of [
        ["textColor", "--text-color"],
        ["secondaryBackgroundColor", "--secondary-background-color"]
      ]) {
        if (theme[key]) document.documentElement.style.setProperty(property, theme[key]);
      }
      send("streamlit:setFrameHeight", { height: 56 });
    });
    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 56 });
  })();
  </script>
</body>
</html>
