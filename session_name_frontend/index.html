<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 44px; overflow: hidden; background: transparent; }
    body { height: 44px; display: flex; align-items: center; font: 750 13px system-ui, sans-serif; }
    #name-button, #name-input {
      display: block; width: 100%; height: 38px; padding: 8px 11px;
      border-radius: 8px; border: 1px solid transparent;
      font: inherit; text-align: left;
    }
    #name-button {
      display: flex; align-items: center; gap: 7px;
      cursor: pointer; color: #fff; min-width: 0;
    }
    #name-label {
      min-width: 0; flex: 1 1 auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Viewed session is identified only by this high-contrast green check. */
    #selected-check {
      display: inline-flex; flex: none;
      align-items: center; justify-content: center;
      width: 21px; height: 21px; border-radius: 50%;
      color: #128238; background: #ffffff;
      border: 1px solid #d3f5da;
      font: 900 16px/1 system-ui, sans-serif;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
    }
    #name-button.completed { background: #16803e; border-color: #166534; }
    #name-button.completed:hover { background: #1b994e; }
    #name-button.pending { background: #c62828; border-color: #991b1b; }
    #name-button.pending:hover { background: #dc3636; }
    #name-button:focus-visible { outline: 3px solid #60a5fa; outline-offset: -3px; }
    #name-input { background: #fff; color: #16181c; border: 2px solid #4a9fea; font-weight: 700; }
    #name-input:focus { outline: 1px solid #60a5fa; }
    #context-menu { position: absolute; top: 44px; left: 4px; right: 4px;
      padding: 4px; border-radius: 8px; background: #fff;
      border: 1px solid #cbd5e1; box-shadow: 0 2px 5px #0003; }
    #delete-action { width: 100%; padding: 8px 12px; border: 0;
      background: #fff; color: #b91c1c; text-align: left; cursor: pointer; font: inherit; }
    #delete-action:hover, #delete-action:focus { background: #fee2e2; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <button type="button" id="name-button" class="pending" title="Nhấp để mở; nhấp đúp để đổi tên; chuột phải để xóa"><span id="name-label"></span><span id="selected-check" aria-hidden="true" hidden>✓</span></button>
  <input type="text" id="name-input" aria-label="Đổi tên phiên" maxlength="80" autocomplete="off" hidden/>
  <div id="context-menu" role="menu" aria-label="Thao tác phiên" hidden>
    <button type="button" id="delete-action" role="menuitem">Xóa</button>
  </div>
  <script>
  "use strict";
  (function () {
    const button = document.getElementById("name-button");
    const nameLabel = document.getElementById("name-label");
    const selectedCheck = document.getElementById("selected-check");
    const input = document.getElementById("name-input");
    let name = "", suffix = "", tone = "pending", selected = false, clickTimer = null, editing = false;
    const menu = document.getElementById("context-menu");
    const deleteAction = document.getElementById("delete-action");
    let nonce = 0;
    const send = (type, fields) => {
      window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, "*");
    };
    const emit = (action, value) => {
      nonce += 1;
      send("streamlit:setComponentValue", {
        value: { action, name: value || "", seq: String(Date.now()) + "-" + String(nonce) },
        dataType: "json"
      });
    };
    function closeMenu() {
      menu.hidden = true;
      send("streamlit:setFrameHeight", {height: 44});
    }
    function openMenu(event) {
      event.preventDefault();
      cancelClickTimer();
      if (editing) return;
      menu.hidden = false;
      send("streamlit:setFrameHeight", {height: 100});
      deleteAction.focus();
    }
    button.addEventListener("contextmenu", openMenu);
    button.addEventListener("keydown", function(event) {
      if ((event.shiftKey && event.key === "F10") || event.key === "ContextMenu") openMenu(event);
    });
    deleteAction.addEventListener("click", function(event) {
      event.stopPropagation();
      closeMenu();
      emit("delete");
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && !menu.hidden) { closeMenu(); button.focus(); }
    });
    document.addEventListener("pointerdown", function(event) {
      if (!menu.contains(event.target)) closeMenu();
    });
    window.addEventListener("blur", closeMenu);
    function cancelClickTimer() {
      if (clickTimer !== null) { clearTimeout(clickTimer); clickTimer = null; }
    }
    function exitEditor() {
      editing = false;
      input.hidden = true;
      button.hidden = false;
    }
    function beginEditor() {
      cancelClickTimer();
      closeMenu();
      editing = true;
      input.value = name;
      button.hidden = true;
      input.hidden = false;
      input.focus();
      input.select();
    }
    function saveEditor() {
      const proposed = input.value.trim();
      exitEditor();
      if (proposed && proposed !== name) emit("rename", proposed);
    }
    button.addEventListener("click", function () {
      if (editing) return;
      closeMenu();
      cancelClickTimer();
      // Avoid opening a session on the first click of a double-click.
      clickTimer = setTimeout(function () {
        clickTimer = null;
        emit("open");
      }, 440);
    });
    button.addEventListener("dblclick", function (event) {
      event.preventDefault();
      beginEditor();
    });
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") { event.preventDefault(); saveEditor(); }
      if (event.key === "Escape") { event.preventDefault(); exitEditor(); }
    });
    input.addEventListener("blur", function () {
      // Blur also accepts an edited name for mouse-only users.
      if (editing) saveEditor();
    });
    window.addEventListener("message", function (event) {
      const message = event.data;
      if (!message || message.type !== "streamlit:render" || !message.args) return;
      const args = message.args;
      const newName = typeof args.name === "string" ? args.name : "";
      // Keep an in-progress edit intact across unrelated Streamlit rerenders.
      if (editing && newName !== name) exitEditor();
      name = newName;
      suffix = typeof args.suffix === "string" ? args.suffix : "";
      tone = ["completed", "pending"].includes(args.tone) ? args.tone : "pending";
      selected = args.selected === true;
      nameLabel.textContent = "📄 " + name + suffix;
      selectedCheck.hidden = !selected;
      button.className = tone;
      button.setAttribute("aria-label", name + (selected ? ". Đang xem." : ".") + " Nhấp để mở, nhấp đúp để đổi tên, chuột phải để xóa.");
      send("streamlit:setFrameHeight", {height: 44});
    });
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 44});
  })();
  </script>
</body>
</html>
