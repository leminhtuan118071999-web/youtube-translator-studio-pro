services:
  - type: web
    name: lmt-studio-pro-v2-api
    runtime: python
    plan: free
    rootDir: v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
